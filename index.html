<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title اللي يظهر غالبًا بالازرق في Google -->
    <title>Egypt Holiday Travel</title>

    <!-- Description -->
    <meta
      name="description"
      content="Egypt Holiday Travel offers personalized travel packages, hotels, tours, and holiday experiences across Egypt."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://egyptholidaytravel.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://egyptholidaytravel.com/" />
    <meta property="og:title" content="Egypt Holiday Travel" />
    <meta
      property="og:description"
      content="Discover Egypt with personalized travel packages, hotels, tours, and more."
    />
    <meta property="og:site_name" content="Egypt Holiday Travel" />
    <meta property="og:image" content="https://egyptholidaytravel.com/logo-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Egypt Holiday Travel" />
    <meta
      name="twitter:description"
      content="Discover Egypt with personalized travel packages, hotels, tours, and more."
    />
    <meta name="twitter:image" content="https://egyptholidaytravel.com/logo-512.png" />

    <!-- Google site name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Egypt Holiday Travel",
        "alternateName": "Egypt Holiday Travel",
        "url": "https://egyptholidaytravel.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
