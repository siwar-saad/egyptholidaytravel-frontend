<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Egypt Holiday Travel</title>

    <!-- SEO description Google -->
    <meta
      name="description"
      content="Egypt Holiday Travel offers personalized travel packages, hotels, tours, and holiday experiences across Egypt at affordable prices."
    />

    <meta
      name="keywords"
      content="Egypt Holiday Travel, Egypt tours, Egypt packages, Egypt hotels, travel agency Egypt, Cairo trips, Sharm El Sheikh, Hurghada"
    />

    <meta name="author" content="Egypt Holiday Travel" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://egyptholidaytravel.com/" />

    <!-- Favicon for browser + Google -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Egypt Holiday Travel" />
    <meta property="og:title" content="EHT Egypt Holiday Travel" />
    <meta
      property="og:description"
      content="Discover Egypt with personalized travel packages, hotels, tours, beaches, history, and adventure."
    />
    <meta property="og:url" content="https://egyptholidaytravel.com/" />
    <meta property="og:image" content="https://egyptholidaytravel.com/apple-touch-icon.png" />

    <!-- Google Site Name Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Egypt Holiday Travel",
        "alternateName": ["EHT Egypt Holiday Travel", "EHT"],
        "url": "https://egyptholidaytravel.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
